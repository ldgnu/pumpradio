<!DOCTYPE html>
<html lang="es-AR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">

  <!-- SEO / OpenGraph -->
  <title>PumpRadio — Hardtechno · Hardcore · Rave Underground</title>
  <meta name="description" content="PumpRadio: radio underground de hardtechno, hardcore, gabber, hardstyle y rave. Transmisión en vivo 24/7 desde Argentina.">
  <meta name="keywords" content="hardtechno radio, hardcore radio, gabber radio, hardstyle radio, rave radio argentina, underground electronic radio, pump radio, musica electronica underground">

  <meta property="og:title" content="PumpRadio — Hardtechno · Hardcore · Rave Underground">
  <meta property="og:description" content="Radio underground de hardtechno, hardcore, gabber y rave. En vivo 24/7.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pumpradio.com.ar">
  <meta property="og:image" content="https://pumpradio.com.ar/og-image.png">
  <meta property="og:locale" content="es_AR">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PumpRadio — Underground Rave Radio">
  <meta name="twitter:description" content="Hardtechno · Hardcore · Gabber · Hardstyle · En vivo 24/7">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/pumpradio-logo-192.png">
  <link rel="apple-touch-icon" href="/pumpradio-logo-192.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="canonical" href="https://pumpradio.com.ar">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Preload stream? No, browsers block autoplay anyway -->

  <script type="module" src="/src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {})
      })
    }
  </script>
</head>
<body>
  <div id="app" class="app">

    <!-- Header -->
    <header>
      <div class="header-inner">
        <a href="/" class="logo">
          <span class="logo-icon"></span>
          <span class="logo-text">Pump<span>Radio</span></span>
        </a>
        <div class="station-selector">
          <select id="station-select" aria-label="Seleccionar estación">
            <!-- populated by JS -->
          </select>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Player Section -->
      <section id="player-section" class="player-section">

        <!-- Ambient Background -->
        <div class="player-bg">
          <canvas id="ambient-canvas"></canvas>
          <div class="player-bg-overlay"></div>
        </div>

        <!-- Player Content -->
        <div class="player-content">

          <!-- Album Art -->
          <div id="album-art" class="album-art">
            <img id="album-img" src="" alt="Cover" style="display:none">
            <div id="album-fallback" class="fallback">P</div>
          </div>

          <!-- Track Info -->
          <div class="track-info">
            <div id="live-badge" class="live-badge">
              <span class="dot"></span>
              <span>En vivo</span>
            </div>
            <div id="song-name" class="song-name">Cargando...</div>
            <div id="artist-name" class="artist-name">PumpRadio</div>
            <div id="station-tag" class="station-tag">Hardtechno</div>
            <div id="station-name" class="station-name"></div>
          </div>

          <!-- Visualizer Bars -->
          <div id="visualizer-bars" class="visualizer idle"></div>

          <!-- Controls -->
          <div class="player-controls">
            <button id="play-btn" class="btn-play" aria-label="Reproducir / Pausar">
              <span id="play-icon">▶</span>
            </button>
          </div>

          <!-- Volume -->
          <div class="volume-control">
            <span id="vol-icon" class="vol-icon">🔊</span>
            <input type="range" id="volume" class="volume-slider" min="0" max="100" value="80" aria-label="Volumen">
          </div>

          <!-- Station Description -->
          <div class="station-info">
            <p id="station-desc"></p>
            <div id="genre-tags" class="genre-tags"></div>
          </div>

        </div>
      </section>

      <!-- News Section -->
      <section class="news-section" id="news-section">
        <div class="section-header">
          <h2>▍ Noticias</h2>
          <span class="text-muted" style="font-size:0.7rem;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.1em">Underground · Cultura rave</span>
        </div>
        <div id="news-container" class="news-grid">
          <!-- populated by JS -->
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer>
      PumpRadio <span>●</span> Live from Argentina <span>●</span> Hardtechno · Hardcore · Rave
    </footer>
  </div>

  <!-- Error Overlay -->
  <div id="error-overlay" class="error-overlay">
    <div class="error-icon">⚠</div>
    <p id="error-text">Error de conexión</p>
    <button id="retry-btn" class="btn-retry">Reintentar</button>
  </div>

  <!-- Shortcuts Modal -->
  <div class="shortcuts-hint">
    <button id="shortcuts-btn" class="hint-btn" aria-label="Atajos de teclado">?</button>
    <div id="shortcuts-modal" class="shortcuts-modal">
      <h4>Atajos</h4>
      <div class="shortcut-row"><span>Play/Pause</span> <kbd>Space</kbd> <kbd>K</kbd></div>
      <div class="shortcut-row"><span>Volumen +</span> <kbd>↑</kbd></div>
      <div class="shortcut-row"><span>Volumen −</span> <kbd>↓</kbd></div>
      <div class="shortcut-row"><span>Mute</span> <kbd>M</kbd></div>
      <div class="shortcut-row"><span>Siguiente</span> <kbd>→</kbd> <kbd>N</kbd></div>
      <div class="shortcut-row"><span>Anterior</span> <kbd>←</kbd> <kbd>P</kbd></div>
      <div class="shortcut-row"><span>Pantalla completa</span> <kbd>F</kbd></div>
      <div class="shortcut-row"><span>Ayuda</span> <kbd>?</kbd></div>
    </div>
  </div>
</body>
</html>

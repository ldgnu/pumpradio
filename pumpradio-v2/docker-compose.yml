# ============================================================
# PumpRadio v2 — Docker Compose (Production)
# ============================================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f app        # Follow app logs
#   docker compose exec app npx prisma db push  # Sync DB schema
#   docker compose down -v            # Stop + remove volumes
# ============================================================

services:
  # ─── APP ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pumpradio/app:${TAG:-latest}
    container_name: pumpradio-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pumpradio}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-pumpradio}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?}@redis:6379
      - NEXTAUTH_URL=${APP_URL:-https://pumpradio.local}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?}
      - NEXT_PUBLIC_APP_URL=${APP_URL:-https://pumpradio.local}
      - NEXT_PUBLIC_APP_NAME=PumpRadio
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - pumpradio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── DATABASE (PostgreSQL) ────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pumpradio-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pumpradio}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:-pumpradio}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pumpradio-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - pumpradio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pumpradio} -d ${POSTGRES_DB:-pumpradio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── CACHE (Redis) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pumpradio-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:?}
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - pumpradio-redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - pumpradio
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pumpradio-db:
    name: pumpradio-db
  pumpradio-redis:
    name: pumpradio-redis

networks:
  pumpradio:
    name: pumpradio
    driver: bridge
